# Ative com: -Dspring.profiles.active=postgres  (ou SPRING_PROFILES_ACTIVE=postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:digitalmember}
spring.datasource.username=${DB_USER:digitalmember}
spring.datasource.password=${DB_PASSWORD:digitalmember}

spring.h2.console.enabled=false

# Em produção o ideal é trocar por migrations (Flyway) e usar "validate"
spring.jpa.hibernate.ddl-auto=update